<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f7f5fa">
  <title>ข้อมูลการเดินทาง | Japan Planner by Anya</title>
  <style>
    :root{--ink:#332c40;--paper:#f7f5fa;--card:#fffefe;--line:#e6dfed;--purple:#51466b;--soft:#f5eef6;--link:#63518b}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Thai",sans-serif}.shell{max-width:1000px;margin:auto;padding:0 20px 58px}.topbar{height:68px;display:flex;align-items:center;border-bottom:1px solid rgba(189,181,213,.38)}.brand{color:var(--purple);font-size:11px;font-weight:750;letter-spacing:.12em;text-decoration:none}.brand span{font-weight:450}
    .hero{margin:20px 0 25px;padding:27px 25px 24px;border:1px solid rgba(189,181,213,.62);border-radius:16px;background:linear-gradient(125deg,rgba(203,195,227,.42),rgba(216,191,216,.3))}.back{display:inline-flex;margin-bottom:17px;padding:8px 12px;border:1px solid #bdb5d5;border-radius:999px;color:var(--purple);background:#fff;text-decoration:none;font-size:12px;font-weight:680}.eyebrow{color:#75628f;font-size:10px;font-weight:750;letter-spacing:.13em;text-transform:uppercase}.eyebrow:before{display:inline-block;width:19px;height:1px;margin:0 8px 3px 0;background:currentColor;content:""}h1{margin:12px 0 7px;font-family:Georgia,"Noto Serif Thai",serif;font-size:clamp(29px,6vw,44px);font-weight:500;line-height:1.2}.hero-copy{margin:0;color:#686274;font-size:13px;line-height:1.8}
    .sticky-tools{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:12px;margin:0 0 28px;padding:11px 0;background:rgba(247,245,250,.94);border-bottom:1px solid rgba(189,181,213,.45);backdrop-filter:blur(10px)}.quick{display:flex;flex:1;min-width:0;gap:7px;margin:0;overflow:auto;padding-bottom:4px}.quick a{flex:0 0 auto;padding:9px 13px;border:1px solid #bdb5d5;border-radius:999px;color:var(--purple);background:#fff;text-decoration:none;font-size:11px;font-weight:700}.search-box{display:flex;flex:0 0 245px;align-items:center;gap:8px;padding:8px 12px;border:1px solid #bdb5d5;border-radius:999px;background:#fff;color:#75628f}.search-box span{font-size:15px}.search-box input{width:100%;border:0;outline:0;color:var(--ink);background:transparent;font:inherit;font-size:12px}.search-box input::placeholder{color:#938ba1}.travel-note{margin:0 0 34px;padding:16px 18px;border:1px solid var(--line);border-radius:13px;background:#fff;color:#665f70;font-size:16px;line-height:1.75}.travel-note strong{display:block;margin-bottom:4px;color:var(--purple);font-size:14px;letter-spacing:.05em}
    .day{margin:0 0 42px}.day-head{margin-bottom:15px}.kicker{margin:0 0 5px;color:#75628f;font-size:12px;font-weight:800;letter-spacing:.12em}.day h2{margin:0;font-family:Georgia,"Noto Serif Thai",serif;font-size:23px;font-weight:500}.day-brief{margin:7px 0 0;color:#686274;font-size:13px;line-height:1.7}.schedule{display:grid;gap:11px}.stop{padding:15px 16px;border:1px solid var(--line);border-radius:12px;background:var(--card);box-shadow:0 7px 19px rgba(65,52,83,.045)}.stop.subheading{background:#f7f2fa}.stop.subheading .stop-title{font-size:16px}.stop.staff{border:2px solid #c7a948;background:linear-gradient(135deg,#fffdf3,#fff8cf);box-shadow:0 10px 24px rgba(126,99,23,.12)}.stop.staff .stop-title{font-size:18px;color:#5a4712}.stop.staff .stop-title:before{content:"🗣️ ";font-size:16px}.stop-title{margin:0 0 7px;color:var(--purple);font-size:16px;font-weight:760;line-height:1.5}.stop p{margin:5px 0;color:#5f5969;font-size:14px;line-height:1.6}.stop p.highlight{padding:9px 11px;border-left:4px solid #d2ad31;border-radius:5px;background:#fff0a8;color:#483a12;font-weight:760}.stop p.staff-copy{font-size:15px;font-weight:650;color:#4d3d13}.stop p.staff-copy.highlight{font-size:15px}.stop a{display:inline-flex;margin:8px 7px 0 0;padding:6px 10px;border:1px solid #d4cce4;border-radius:999px;color:var(--link);background:#faf8fd;font-size:11px;font-weight:700;text-decoration:none}.stop a:hover{background:#f0ebf8}.stop-gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
    .doc-card{position:relative;display:block;width:100%;padding:0;border:0;border-radius:12px;background:#fff;cursor:zoom-in;text-align:left;overflow:hidden;box-shadow:0 8px 20px rgba(65,52,83,.06)}.doc-card img{display:block;width:100%;height:220px;object-fit:cover;border:1px solid var(--line);border-radius:12px}.doc-label{position:absolute;right:8px;bottom:8px;padding:5px 8px;border-radius:999px;color:#fff;background:#332c40d9;font-size:10px;line-height:1}.doc-card:focus-visible{outline:3px solid #a99bc9;outline-offset:3px}
    footer{margin-top:28px;padding:27px 8px 0;border-top:1px solid var(--line);color:#8a8391;text-align:center;font-size:10px;line-height:1.8}footer strong{display:block;color:var(--purple);font-size:10px;letter-spacing:.12em}footer .remark{display:block;margin-top:9px;color:#8f3f4d;font-size:10px;line-height:1.7}.social-links{display:flex;justify-content:center;gap:8px;margin-top:12px}.social-link{display:grid;width:25px;height:25px;place-items:center;border:1px solid rgba(101,82,127,.28);border-radius:50%;color:var(--purple);background:rgba(255,254,254,.55);text-decoration:none;transition:background .18s ease,color .18s ease,transform .18s ease}.social-link:hover{color:#fff;background:var(--purple);transform:translateY(-1px)}.social-link span{font-size:11px;font-weight:750;line-height:1}.social-link.line span{font-size:7px;letter-spacing:-.04em}.social-link svg{width:14px;height:14px;display:block}.social-link.instagram svg,.social-link.tiktok svg{width:15px;height:15px}.go-top{position:fixed;right:22px;bottom:22px;z-index:4;display:flex;align-items:center;gap:5px;padding:10px 13px;border:1px solid #bdb5d5;border-radius:999px;color:#fff;background:var(--purple);box-shadow:0 8px 20px rgba(65,52,83,.2);font:700 12px inherit;cursor:pointer;opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .2s,transform .2s}.go-top.visible{opacity:1;pointer-events:auto;transform:translateY(0)}.viewer{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:18px;background:#261f31f5}.viewer[hidden]{display:none}.viewer img{max-width:94vw;max-height:88vh;object-fit:contain}.close{position:fixed;top:18px;right:18px;width:42px;height:42px;border:1px solid #ffffff55;border-radius:50%;color:#fff;background:#ffffff18;font-size:25px;cursor:pointer}
    @media(max-width:700px){.shell{padding:0 15px 45px}.hero{padding:22px 17px}.sticky-tools{display:block;padding:9px 0}.quick{margin-bottom:9px}.search-box{width:100%}.stop{padding:14px}.stop-gallery{grid-template-columns:1fr}.doc-card img{height:210px}.go-top{right:15px;bottom:15px}}
    .stop[id]{scroll-margin-top:120px}
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar"><a class="brand" href="../index.html">JAPAN PLANNER <span>BY ANYA</span></a></header>
    <section class="hero"><a class="back" href="../index.html">← กลับหน้าแรก</a><div class="eyebrow">YOUR TRAVEL DOCUMENTS</div><h1>ข้อมูลการเดินทาง 🧳</h1></section>
    <div class="sticky-tools"><nav class="quick" aria-label="เลือกหัวข้อการเดินทาง"></nav><label class="search-box"><span aria-hidden="true">⌕</span><input id="travel-search" type="search" placeholder="ค้นหา สถานที่ หรือ วิธีเดินทาง" aria-label="ค้นหา สถานที่ หรือ วิธีเดินทาง"></label></div>
    <main id="days"></main>
    <footer><strong>JAPAN PLANNER BY ANYA</strong><span>วางแผนทริปได้ง่ายขึ้นในที่เดียว</span><span class="remark">เว็บไซต์นี้จะถูกลบและเข้าถึงไม่ได้หลังทริปจบ<br>หากต้องการเอกสาร กรุณาติดต่ออันย่าได้ทุกช่องทาง</span><nav class="social-links" aria-label="ช่องทางติดต่อ"><a class="social-link" href="https://www.facebook.com/jpplanneranya" target="_blank" rel="noopener noreferrer" aria-label="Facebook"><span>f</span></a><a class="social-link line" href="https://line.me/ti/p/5juCYxEUjk" target="_blank" rel="noopener noreferrer" aria-label="LINE"><span>LINE</span></a><a class="social-link" href="https://www.instagram.com/jp.planner.anya/" target="_blank" rel="noopener noreferrer" aria-label="Instagram"><span>◎</span></a><a class="social-link" href="https://www.tiktok.com/@planner.anya" target="_blank" rel="noopener noreferrer" aria-label="TikTok"><span>♪</span></a></nav></footer>
  </div>
  <button class="go-top" id="go-top" type="button" aria-label="กลับด้านบน">↑ <span>กลับด้านบน</span></button>
  <div class="viewer" id="viewer" hidden><button class="close" id="close" aria-label="ปิดภาพ">×</button><img id="viewer-image" alt=""></div>
  <script>
    const days = [
      {id:4,kicker:'Day 4',date:'16 พฤศจิกายน 2026',title:'วิธีเดินทางสำหรับ Free Day Tokyo',entries:[
        {anchor:'city-transfer',title:'09:00 - ออกจาก Asia Hotel Narita เข้าเมือง',text:[{value:'ยิ่งเดินทางเร็ว ก็ยิ่งมีเวลาเที่ยวเยอะขึ้น',kind:'highlight'},'Asia Hotel Narita · 1階, 2 Chome-1-2 Igodai, Narita, Chiba 286-0035, Japan','เดินประมาณ 10 นาที (650 ม.) ไปสถานี Keisei-Narita','ขึ้น Keisei Line Limited Express Keisei-Ueno ใช้เวลาประมาณ 1 ชั่วโมง 9 นาที (14 สถานี) แล้วลงที่ Keisei-Ueno'],links:[['เปิด Google Maps เส้นทางไป Ueno','https://maps.app.goo.gl/V8FnQZ8FP4njZuDF9'],['ซื้อตั๋ว Keisei Skyliner ล่วงหน้าผ่าน Klook','https://www.klook.com/activity/1410-skyliner-tokyo/']],images:['customer-travel-info-hotel-to-ueno.png']},
        {title:'เดินทางจาก Ueno ไป Tsukiji',text:['เดินทางด้วย Tokyo Metro สาย Hibiya ที่นำทางไป Local Naka-Meguro','ออกทางออก 1 แล้วเดินตามแผนที่จะเจอกับตลาดปลา'],links:[['เปิด Google Maps','https://maps.app.goo.gl/JgEuj9GhHyXEuRCJ6']],images:['customer-travel-info-tsukiji.png']},
        {title:'เดินทางไป Shibuya',text:['ขึ้นที่สถานี Tsukijishijo ของ Tokyo Metro สาย Hibiya หรือ Oedo','นั่งไปทาง Daimon / Roppongi','ลงที่สถานี Aoyama-Itchome เพื่อเปลี่ยนสายไป Hanzomon ที่สถานีเดียวกัน','นั่งไปทาง Chuorinkan หรือเลือกขบวนที่พาไป Shibuya ได้โดยตรง',{value:'เมื่อถึง Shibuya แล้ว ออกทางออกไหนก็ได้ ไม่สำคัญ แล้วค่อยตั้งหลักเพื่อไปแต่ละสถานที่',kind:'highlight'}],links:[['เปิด Google Maps','https://maps.app.goo.gl/JfYB4iC3JrS3b2dW6']],images:['customer-travel-info-shibuya.png']},
        {title:'วิธีกลับ · 20:00 ต้องเริ่มกลับแล้ว',text:['เดินทางด้วย JR Line สาย Yamanote ไปทาง Ueno (Clockwise)','ลงที่ Ueno แล้วเดินไป Keisei-Ueno เพื่อขึ้น Keisei Line Limited Express ไป Keisei-Narita'],links:[['เปิด Google Maps','https://maps.app.goo.gl/VTfYKcufAU3L5d8q6']],images:['customer-travel-info-return.png']},
        {anchor:'return-hotel',title:'เดินทางกลับ Asia Hotel Narita',text:[{value:'ควรเผื่อเวลากลับประมาณ 1 ชั่วโมงครึ่งก่อน 23:00 น.',kind:'highlight'},'ลงที่ Keisei-Narita แล้วเดินกลับโรงแรมประมาณ 8 นาที (650 ม.)','Asia Hotel Narita · 1階, 2 Chome-1-2 Igodai, Narita, Chiba 286-0035, Japan'],links:[['เปิด Google Maps เส้นทางกลับโรงแรม','https://maps.app.goo.gl/Hq5jb5gURzyGAAw87']],images:['customer-travel-info-ueno-to-hotel.png']}
      ]}
    ];
    const quick=document.querySelector('.quick');quick.innerHTML=days.map(day=>`<a href="#day-${day.id}">${day.kicker}</a>`).join('');
    const search=document.querySelector('#travel-search');
    const goTop=document.querySelector('#go-top');
    function filterTravel(){const query=search.value.trim().toLowerCase();document.querySelectorAll('.day').forEach(day=>{let matched=false;day.querySelectorAll('.stop').forEach(stop=>{const hit=!query||stop.textContent.toLowerCase().includes(query);stop.hidden=!hit;if(hit)matched=true});day.hidden=Boolean(query&&!matched)})}
    search.addEventListener('input',filterTravel);
    function toggleGoTop(){goTop.classList.toggle('visible',window.scrollY>320)}
    window.addEventListener('scroll',toggleGoTop,{passive:true});toggleGoTop();goTop.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
    const main=document.querySelector('#days');
    days.forEach(day=>{
      const section=document.createElement('section');section.className='day';section.id='day-'+day.id;
      const entries=day.entries.map(entry=>{const images=(entry.images||[]).map((file,index)=>`<button class="doc-card" type="button" data-image="../assets/travel-document/${file}" data-alt="${entry.title} เอกสารรูปที่ ${index+1}"><img src="../assets/travel-document/${file}" alt="${entry.title} เอกสารรูปที่ ${index+1}" loading="lazy"><span class="doc-label">แตะเพื่อเปิดภาพ</span></button>`).join('');const paragraphs=(entry.text||[]).map(item=>{const value=typeof item==='string'?item:item.value;const kind=typeof item==='string'?'':` class="${item.kind||''}"`;return `<p${kind}>${value}</p>`}).join('');const title=entry.restaurantId?entry.title.replace(entry.restaurantName,`<a class="restaurant-link" href="../restaurant/index.html#restaurant-${entry.restaurantId}">${entry.restaurantName} - คลิกเพื่อดูร้านอาหาร</a>`):entry.title;return `<article${entry.anchor?` id="${entry.anchor}"`:''} class="stop ${entry.variant||''}"><h3 class="stop-title">${title}</h3>${paragraphs}${(entry.links||[]).map(([label,url])=>`<a href="${url}" target="_blank" rel="noopener">${label} ↗</a>`).join('')}${images?`<div class="stop-gallery">${images}</div>`:''}</article>`}).join('');
      section.innerHTML=`<div class="day-head"><p class="kicker">${day.kicker}</p><h2>${day.date}</h2><p class="day-brief">${day.title}</p></div><div class="schedule">${entries}</div>`;main.appendChild(section);
    });
    const viewer=document.querySelector('#viewer'),viewerImage=document.querySelector('#viewer-image');document.querySelectorAll('.doc-card').forEach(card=>card.addEventListener('click',()=>{viewerImage.src=card.dataset.image;viewerImage.alt=card.dataset.alt;viewer.hidden=false;document.body.style.overflow='hidden'}));
    function closeViewer(){viewer.hidden=true;document.body.style.overflow=''}document.querySelector('#close').addEventListener('click',closeViewer);viewer.addEventListener('click',event=>{if(event.target===viewer)closeViewer()});document.addEventListener('keydown',event=>{if(event.key==='Escape')closeViewer()});
  </script>
</body>
</html>
