<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f2fa">
  <meta name="description" content="รวมลิงก์เอกสารทริปจาก Japan Planner by Anya">
  <title>Japan Planner by Anya</title>
  <style>
    :root { color-scheme: light; --ink:#332c40; --muted:#777184; --purple:#65527f; --lavender:#e8e0f1; --line:#e7dfed; --paper:#f6f2fa; --white:#fffefe; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; padding:0 18px 28px; color:var(--ink); background:radial-gradient(ellipse at 50% -10%,rgba(216,191,216,.54),transparent 42rem),var(--paper); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Thai",sans-serif; -webkit-font-smoothing:antialiased; }
    .topbar { display:flex; width:min(100%,780px); min-height:62px; align-items:center; justify-content:space-between; margin:0 auto; border-bottom:1px solid rgba(189,181,213,.42); }
    .brand { color:#514064; font-size:11px; font-weight:760; letter-spacing:.13em; }
    main { width:min(100%,510px); margin:0 auto; }
    .profile { padding:52px 18px 27px; text-align:center; }
    .eyebrow { color:var(--purple); font-size:10px; font-weight:750; letter-spacing:.14em; }
    h1 { margin:12px 0 7px; font-family:Georgia,"Noto Serif Thai",serif; font-size:clamp(30px,8vw,42px); font-weight:500; letter-spacing:-.04em; }
    .intro { margin:0; color:var(--muted); font-size:12px; line-height:1.8; }
    .section-title { margin:20px 2px 10px; color:var(--purple); font-size:11px; font-weight:750; letter-spacing:.06em; }
    .trip-link { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:18px 19px; border:1px solid var(--line); border-radius:14px; background:var(--white); box-shadow:0 12px 32px rgba(65,52,83,.06); text-decoration:none; transition:transform .18s ease,border-color .18s ease; }
    .trip-link:hover { transform:translateY(-2px); border-color:#bdb5d5; }
    .trip-copy strong { display:block; font-size:15px; line-height:1.5; }
    .trip-copy span { display:block; margin-top:4px; color:var(--muted); font-size:11px; }
    .arrow { color:var(--purple); font-size:21px; }
    footer { margin-top:30px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); text-align:center; font-size:10px; letter-spacing:.1em; }
    @media (max-width:520px) { .topbar { min-height:58px; } .brand { font-size:10px; } .profile { padding-top:42px; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { transition-duration:.01ms!important; } }
  </style>
</head>
<body>
  <header class="topbar"><div class="brand">JAPAN PLANNER BY ANYA</div></header>
  <main>
    <section class="profile">
      <div class="eyebrow">PERSONAL TRIP DOCUMENTS</div>
      <h1>Japan Planner by Anya</h1>
      <p class="intro">รวมเอกสารทริปไว้ในที่เดียว<br>เลือกทริปที่ต้องการเพื่อเปิดดูรายละเอียด</p>
    </section>
    <section aria-labelledby="trips-title">
      <h2 class="section-title" id="trips-title">ทริปที่เผยแพร่</h2>
      <a class="trip-link" href="bear10-14oct/index.html">
        <span class="trip-copy"><strong>Tokyo itinerary 🗼</strong><span>10–14 ตุลาคม 2026 · โตเกียว</span></span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </section>
    <footer>JAPAN PLANNER BY ANYA</footer>
  </main>
</body>
</html>
