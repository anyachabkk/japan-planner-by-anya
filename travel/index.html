<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f7f5fa">
  <title>ข้อมูลการเดินทาง | Japan Planner by Anya</title>
  <style>
    :root{--ink:#332c40;--paper:#f7f5fa;--card:#fffefe;--line:#e6dfed;--purple:#51466b;--soft:#f5eef6;--link:#63518b}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Thai",sans-serif}.shell{max-width:1000px;margin:auto;padding:0 20px 58px}.topbar{height:68px;display:flex;align-items:center;border-bottom:1px solid rgba(189,181,213,.38)}.brand{color:var(--purple);font-size:11px;font-weight:750;letter-spacing:.12em;text-decoration:none}.brand span{font-weight:450}
    .hero{margin:20px 0 25px;padding:27px 25px 24px;border:1px solid rgba(189,181,213,.62);border-radius:16px;background:linear-gradient(125deg,rgba(203,195,227,.42),rgba(216,191,216,.3))}.back{display:inline-flex;margin-bottom:17px;padding:8px 12px;border:1px solid #bdb5d5;border-radius:999px;color:var(--purple);background:#fff;text-decoration:none;font-size:12px;font-weight:680}.eyebrow{color:#75628f;font-size:10px;font-weight:750;letter-spacing:.13em;text-transform:uppercase}.eyebrow:before{display:inline-block;width:19px;height:1px;margin:0 8px 3px 0;background:currentColor;content:""}h1{margin:12px 0 7px;font-family:Georgia,"Noto Serif Thai",serif;font-size:clamp(29px,6vw,44px);font-weight:500;line-height:1.2}.hero-copy{margin:0;color:#686274;font-size:13px;line-height:1.8}
    .sticky-tools{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:12px;margin:0 0 28px;padding:11px 0;background:rgba(247,245,250,.94);border-bottom:1px solid rgba(189,181,213,.45);backdrop-filter:blur(10px)}.quick{display:flex;flex:1;min-width:0;gap:7px;margin:0;overflow:auto;padding-bottom:4px}.quick a{flex:0 0 auto;padding:9px 13px;border:1px solid #bdb5d5;border-radius:999px;color:var(--purple);background:#fff;text-decoration:none;font-size:11px;font-weight:700}.search-box{display:flex;flex:0 0 245px;align-items:center;gap:8px;padding:8px 12px;border:1px solid #bdb5d5;border-radius:999px;background:#fff;color:#75628f}.search-box span{font-size:15px}.search-box input{width:100%;border:0;outline:0;color:var(--ink);background:transparent;font:inherit;font-size:12px}.search-box input::placeholder{color:#938ba1}.travel-note{margin:0 0 34px;padding:16px 18px;border:1px solid var(--line);border-radius:13px;background:#fff;color:#665f70;font-size:16px;line-height:1.75}.travel-note strong{display:block;margin-bottom:4px;color:var(--purple);font-size:14px;letter-spacing:.05em}
    .day{margin:0 0 42px}.day-head{margin-bottom:15px}.kicker{margin:0 0 5px;color:#75628f;font-size:12px;font-weight:800;letter-spacing:.12em}.day h2{margin:0;font-family:Georgia,"Noto Serif Thai",serif;font-size:23px;font-weight:500}.day-brief{margin:7px 0 0;color:#686274;font-size:13px;line-height:1.7}.schedule{display:grid;gap:11px}.stop{padding:15px 16px;border:1px solid var(--line);border-radius:12px;background:var(--card);box-shadow:0 7px 19px rgba(65,52,83,.045)}.stop.subheading{background:#f7f2fa}.stop.subheading .stop-title{font-size:16px}.stop.staff{border:2px solid #c7a948;background:linear-gradient(135deg,#fffdf3,#fff8cf);box-shadow:0 10px 24px rgba(126,99,23,.12)}.stop.staff .stop-title{font-size:18px;color:#5a4712}.stop.staff .stop-title:before{content:"🗣️ ";font-size:16px}.stop-title{margin:0 0 7px;color:var(--purple);font-size:16px;font-weight:760;line-height:1.5}.stop p{margin:5px 0;color:#5f5969;font-size:14px;line-height:1.6}.stop p.highlight{padding:9px 11px;border-left:4px solid #d2ad31;border-radius:5px;background:#fff0a8;color:#483a12;font-weight:760}.stop p.staff-copy{font-size:15px;font-weight:650;color:#4d3d13}.stop p.staff-copy.highlight{font-size:15px}.stop a{display:inline-flex;margin:8px 7px 0 0;padding:6px 10px;border:1px solid #d4cce4;border-radius:999px;color:var(--link);background:#faf8fd;font-size:11px;font-weight:700;text-decoration:none}.stop a:hover{background:#f0ebf8}.stop-gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
    .doc-card{position:relative;display:block;width:100%;padding:0;border:0;border-radius:12px;background:#fff;cursor:zoom-in;text-align:left;overflow:hidden;box-shadow:0 8px 20px rgba(65,52,83,.06)}.doc-card img{display:block;width:100%;height:220px;object-fit:cover;border:1px solid var(--line);border-radius:12px}.doc-label{position:absolute;right:8px;bottom:8px;padding:5px 8px;border-radius:999px;color:#fff;background:#332c40d9;font-size:10px;line-height:1}.doc-card:focus-visible{outline:3px solid #a99bc9;outline-offset:3px}
    footer{margin-top:28px;padding:27px 8px 0;border-top:1px solid var(--line);color:#8a8391;text-align:center;font-size:10px;line-height:1.8}footer strong{display:block;color:var(--purple);letter-spacing:.12em}.go-top{position:fixed;right:22px;bottom:22px;z-index:4;display:flex;align-items:center;gap:5px;padding:10px 13px;border:1px solid #bdb5d5;border-radius:999px;color:#fff;background:var(--purple);box-shadow:0 8px 20px rgba(65,52,83,.2);font:700 12px inherit;cursor:pointer;opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .2s,transform .2s}.go-top.visible{opacity:1;pointer-events:auto;transform:translateY(0)}.viewer{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:18px;background:#261f31f5}.viewer[hidden]{display:none}.viewer img{max-width:94vw;max-height:88vh;object-fit:contain}.close{position:fixed;top:18px;right:18px;width:42px;height:42px;border:1px solid #ffffff55;border-radius:50%;color:#fff;background:#ffffff18;font-size:25px;cursor:pointer}
    @media(max-width:700px){.shell{padding:0 15px 45px}.hero{padding:22px 17px}.sticky-tools{display:block;padding:9px 0}.quick{margin-bottom:9px}.search-box{width:100%}.stop{padding:14px}.stop-gallery{grid-template-columns:1fr}.doc-card img{height:210px}.go-top{right:15px;bottom:15px}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar"><a class="brand" href="../index.html">JAPAN PLANNER <span>BY ANYA</span></a></header>
    <section class="hero"><a class="back" href="../index.html">← กลับหน้าแรก</a><div class="eyebrow">YOUR TRAVEL DOCUMENTS</div><h1>ข้อมูลการเดินทาง 🧳</h1></section>
    <div class="sticky-tools"><nav class="quick" aria-label="เลือกวันเดินทาง"></nav><label class="search-box"><span aria-hidden="true">⌕</span><input id="travel-search" type="search" placeholder="ค้นหา สถานที่ หรือ ข้อมูลเดินทาง" aria-label="ค้นหา สถานที่ หรือ ข้อมูลเดินทาง"></label></div>
    <div class="travel-note"><strong>Transportation</strong>It is recommended that everyone has 1 IC Card per person. Aside from taking the Shinkansen, we will only use the IC Card for travel during this trip.</div>
    <main id="days"></main>
    <footer><strong>JAPAN PLANNER BY ANYA</strong><span>วางแผนทริปได้ง่ายขึ้นในที่เดียว</span></footer>
  </div>
  <button class="go-top" id="go-top" type="button" aria-label="กลับด้านบน">↑ <span>กลับด้านบน</span></button>
  <div class="viewer" id="viewer" hidden><button class="close" id="close" aria-label="ปิดภาพ">×</button><img id="viewer-image" alt=""></div>
  <script>
    const days = [
      {id:1,kicker:'Day 1',date:'9 ตุลาคม 2026',title:'ออกเดินทางจากสุวรรณภูมิไป Kansai Airport',entries:[{title:'Friday, October 9, 2026 : Suvarnabhumi - Kansai Airport'}]},
      {id:2,kicker:'Day 2',date:'10 ตุลาคม 2026',title:'Kansai Airport',entries:[
        {title:'Saturday, October 10, 2026 : Kansai Airport',images:['image16.png']},
        {title:'Travel Instructions',variant:'subheading',text:['Walk out of the airport.','The train station is opposite the airport on the 2nd floor.','Buy a ticket at the JR Ticket office.','Travel time is about 1 hour and 20 minutes.'],images:['image22.png']},
        {title:'At the JR Ticket Office',variant:'staff',text:[{value:'Inform the staff that you want to book the Haruka Shinkansen (Limited Express) at a time that allows for a comfortable walk to the platform, and also request a reservation for luggage space.',kind:'staff-copy'},{value:'【特急はるかきっぷ購入のお願い】京都駅行きの「特急はるか」（指定席）を大人4名分、予約をお願いします。高齢の旅行者がおりますので、ホームへの移動や乗車に、時間にゆとりがある（ゆっくり歩いて間に合う）出発時間の列車を希望しています。また、大きなスーツケースがあるため、荷物置き場に近い座席の指定も併せてお願いいたします。',kind:'staff-copy highlight'}]},
        {title:'10:00 - Drop off luggage at Ala Hotel Kyōto (Note: Time might be flexible based on train arrival)',text:['The hotel is located behind Kyoto station.',{value:'You can exit the station from any exit that leads to the ground level.',kind:'highlight'},'You can follow Google Maps. It takes about 5 minutes.'],links:[['เปิด Google Maps','https://maps.app.goo.gl/Cp7rKhbnx65f6mg49']],images:['image29.png']}
      ]},
      {id:3,kicker:'Day 3',date:'11 ตุลาคม 2026',title:'Kyoto Tour, Uji City',entries:[
        {title:'Sunday, October 11, 2026 : Kyoto Tour, Uji City'},
        {title:'09:00 - Travel to Uji City',text:['Take the Nara Line from Kyoto Station (Local train, no seat reservation required).','Travel time is about 25 minutes.',{value:'Get off at Uji Station, take the South Exit.',kind:'highlight'}],links:[['เปิด Google Maps','https://maps.app.goo.gl/9KH9mftNYKojcXxp9']],images:['image30.png','image44.png']},
        {title:'11:00 - Byodoin Omotesando (Tea Street)',text:['Takes about 5 minutes to walk from the station.'],links:[['เปิด Google Maps','https://maps.app.goo.gl/XqcSuiTNgPi8JfAC7']],images:['image15.png','image48.png']},
        {title:'13:00 - Byodoin Temple',text:['The temple is at the end of the tea street. Just walk through the park.'],links:[['เปิด Google Maps','https://maps.app.goo.gl/X1xYGEsnmcJPjY5E7']],images:['image24.png']},
        {title:'15:00 - Uji Park',text:['Walk back out of the temple towards the beginning of the park, then turn left.','The park is in the middle of the river. You can walk across to it.'],images:['image14.png','image40.png']},
        {title:'16:00 - Return to Kyoto City',text:['Use the same method as the outbound trip: walk back to the station and travel via the Nara line.','Takes about 25 minutes.',{value:'You can take any exit that brings you to the ground level at Kyoto Station.',kind:'highlight'}],links:[['เปิด Google Maps','https://maps.app.goo.gl/YVivZdt9f52DDR2W9']],images:['image4.png']},
        {title:'17:30 Kyoto Sanjo Shopping Street',text:['From Kyoto Station, take the San-in line to Nijo Station, East Exit. It takes only 7 minutes.','Follow the map and you will reach the market.'],links:[['เปิด Google Maps','https://maps.app.goo.gl/SpcKvzVJxU2sTwTY6']],images:['image1.png','image28.png','image20.png']},
        {title:'Return to the hotel',text:['Walk to Nijo Station and take the San-in line back to Kyoto Station.',{value:'You can exit from any exit that leads to the ground level.',kind:'highlight'}],links:[['เปิด Google Maps','https://maps.app.goo.gl/poANXDwx48kHVUZt5']],images:['image8.png']}
      ]},
      {id:4,kicker:'Day 4',date:'12 ตุลาคม 2026',title:'Kyoto Tour',entries:[
        {title:'Monday, October 12, 2026 : Kyoto Tour'},
        {title:'09:00 - Travel to Bamboo Forest',text:['Travel using the same train line as yesterday (San-In Line).',{value:'Get off at Saga-Arashiyama Station, South exit. Takes about 20 minutes.',kind:'highlight'},'Walk according to the map for about 13 minutes to reach the bamboo forest.'],links:[['เปิด Google Maps','https://maps.app.goo.gl/3TJgzstthYXcAYfw5']],images:['image36.png','image10.png']},
        {title:'10:00 - Sagano Romantic Train',text:['You will walk back to Saga-Arashiyama station area.','Train tickets must be booked in advance.','The station to board is called Saga Torokko (Saga).'],links:[['จองตั๋วผ่าน Klook','https://www.klook.com/th/activity/17066-sagano-romantic-train-ticket-kyoto/']],images:['image10.png','image12.png']},
        {title:'10:30 - Return to Kyoto City',text:["To return to the city, taking the JR line is recommended as it's the fastest.",'Upon finishing the romantic train ride, walk 8 minutes to Umahori Station (JR Line) to head back.'],links:[['เปิด Google Maps','https://maps.app.goo.gl/p4noSJvFzJ1Mec3B6']],images:['image42.png']},
        {title:'12:00 Teramachi Shopping Street',text:['Take the train from Umahori Station and get off at Nijo Station (East Exit). Takes about 20 minutes.','Take bus number 46 at the Nijo stop and get off at the Shijo Kawaramachi stop. Takes about 20 minutes.'],links:[['เปิด Google Maps','https://maps.app.goo.gl/Yn7SQsxAHhdpxGZVA']],images:['image31.png','image23.png','image46.png']},
        {title:'14:00 - Chill walk along the Kamo River',text:['The Kamo River is very close to the market. You can follow the map.','There are stairs where you can walk down to sit and relax by the river (you can go down on either side).'],links:[['เปิด Google Maps','https://maps.app.goo.gl/YWRizMbyh9wPh1EK7']],images:['image5.png','image26.png']},
        {title:'17:00 - Return to the hotel',text:['Take bus number 205 / 4 / 7 at the Kawaramachi Sanjo stop.','Get off at the Nanajo Kawaramachi stop and walk back to the hotel.'],links:[['เปิด Google Maps','https://maps.app.goo.gl/mQRzfvB6F8x2cCsKA']],images:['image41.png','image43.png','image47.png']}
      ]},
      {id:5,kicker:'Day 5',date:'13 ตุลาคม 2026',title:'Osaka',entries:[
        {title:'Tuesday, October 13, 2026 : Osaka'},
        {title:'10:00 - Travel to Osaka',variant:'staff',text:[{value:'Buy a ticket from the staff at the JR office center (the green office marked "Ticket Office" / みどりの窓口).',kind:'staff-copy'},{value:'Note: Inform the staff that you want to book the Nozomi Shinkansen at a time that allows for a comfortable walk to the platform, and request oversized luggage space.',kind:'staff-copy'},{value:'【新幹線きっぷ購入のお願い】新大阪行きの「のぞみ号」（指定席）を大人4名分、予約をお願いします。高齢の旅行者がおりますので、ホームへの移動や乗車に、時間にゆとりがある（ゆっくり歩いて間に合う）出発時間の列車を希望しています。また、大きなスーツケースがあるため、4名とも「特大荷物スペース付き座席」の予約も併せてお願いいたします。',kind:'staff-copy highlight'}],images:['image19.jpg','image11.png']},
        {title:'12:00 - Kuromon Market',text:["If you don't have large luggage, you can go straight to the market.",'From Shin-Osaka Station, take the red Midosuji Line.','Get off at Namba Station and walk to the market.',{value:'You can use any of these exits: B11, B15, B17.',kind:'highlight'}],links:[['เปิด Google Maps','https://maps.app.goo.gl/ESfFRfjXEbHFajnp6']],images:['image13.png']},
        {title:'14:00 - Visit Abeno Harukas Observatory',text:['Walk to the station near the market called Nippombashi.','Take the brown line (Sakaisuji Line) and get off at Dobutsuen-mae Station.','Change to the red Midosuji Line at the same station.',{value:'Get off at Tennoji Station, Exit 9.',kind:'highlight'},'(Total time ~20 mins)','Follow the map a little bit to find the Abeno Harukas building. Go to the 16th floor to connect to the observation deck. Entrance fee is 2,000 yen per person.'],links:[['เปิด Google Maps','https://maps.app.goo.gl/kyFXJVWMZm2nUALD8']],images:['image35.png','image45.png']},
        {title:'16:00 - Glico Sign, Drink Beer, Izakaya in Dotonbori',text:['Return to Tennoji Station and travel to Namba.','You can take a direct train (Midosuji Line) to the Glico sign area. Takes no more than 15 minutes.',{value:'Take Exit 14.',kind:'highlight'},'Follow the map to find the Glico sign and the Dotonbori area.'],links:[['เปิด Google Maps','https://maps.app.goo.gl/TkVTLHJHNBCqtVZa8']],images:['image18.png']},
        {title:'19:00 - Return to the hotel, check in, collect luggage, and rest',text:['From the Glico area, you can easily walk back to the hotel.'],links:[['เปิด Google Maps','https://maps.app.goo.gl/gLmCzRzAe5nFCYjeA']]}
      ]},
      {id:6,kicker:'Day 6',date:'14 ตุลาคม 2026',title:'Kobe',entries:[
        {title:'Wednesday, October 14, 2026 : Kobe'},
        {title:'10:00 - Travel to Kobe',text:['From the hotel, walk to Shinsaibashi Station.','Take the Midosuji Line and get off at Umeda Station.','Change to the Hanshin Line (Direct-Limited Express) at Osaka-Umeda Station and ride all the way to Kobe-Sannomiya Station.',{value:'Take any exit and head to your desired restaurant.',kind:'highlight'}],links:[['เปิด Google Maps','https://maps.app.goo.gl/rAkv7tF9xRkFfMB38']],images:['image27.png']},
        {title:'16:00 - Kobe Chinatown (Nankinmachi)',text:['Very easy to travel from Sannomiya Station via the JR Tokaido Line.',{value:'Get off at Motomachi Station, take the West Exit, and walk just a little bit.',kind:'highlight'}],links:[['เปิด Google Maps','https://maps.app.goo.gl/h4hRT7bwqntVHiFJ9']],images:['image7.png']},
        {title:'18:00 - Return to Osaka',text:['Travel back to Motomachi Station, which is nearby.','Take the JR Tokaido Line straight to Osaka Station.','Transfer to the Midosuji Line (at Umeda) and get off at Namba Station.',{value:'Take any exit (B12, B14, B16, B18) and walk back to the hotel.',kind:'highlight'}],images:['image32.png']}
      ]},
      {id:7,kicker:'Day 7',date:'15 ตุลาคม 2026',title:'Katsuoji Temple · Osakako · Kaiyukan',entries:[
        {title:'Thursday, October 15, 2026 : Osaka'},
        {title:'09:00 - Depart for Katsuoji Temple (Daruma Temple)',text:['Walk from the hotel following the map to Shinsaibashi Station.','Take the Midosuji Line (which connects to Kita-Osaka Kyuko) all the way to Minoh-kayano Station,',{value:'North Exit.',kind:'highlight'},'Total time is about 1 hour. Fare: 1,330 yen.'],links:[['เปิด Google Maps','https://maps.app.goo.gl/dozBJHbL5Kq7NubN8']],images:['image17.png','image2.png','image33.png']},
        {title:'Getting back',text:['After getting off at the station, walk to take bus number 30. The bus stop is called Minoh-kayano.',{value:'Get off at the "Katsuoji" stop, which is right at the temple.',kind:'highlight'},'To return: Use the same method in reverse. Take bus number 30 back and get off at the Minoh-kayano bus stop.']},
        {title:'12:00 - Head south to visit Osakako',text:['Regroup at Minoh-kayano Station and travel south.','Take the Kita-Osaka line all the way to Hommachi Station (takes about 30 minutes).','Change to the Chuo Line and ride to Osakako Station,',{value:'Exit 2.',kind:'highlight'}],links:[['เปิด Google Maps','https://maps.app.goo.gl/3RGvScMjCVqgmpyL8']],images:['image21.png']},
        {title:'3:00 - Santa Maria Cruise & 14:00 - Visit Kaiyukan Aquarium',text:['Arrive at Osakako Station, take Exit 1, and walk to the front of the aquarium.','Buy a combo ticket for the Cruise + Aquarium (they are right next to each other). The price is about 4,xxx yen.','It is recommended to do the cruise first.'],links:[['เปิด Google Maps','https://maps.app.goo.gl/9VDEULsb8xEzWjUm7']],images:['image38.png']},
        {title:'17:00 - Dinner and shopping around Umeda',text:['Return to Osakako Station using the same method.','Take the Chuo Line to Hommachi Station, then change to the Midosuji Line and get off at Umeda Station.','Take any exit; the malls are connected from the underground. Takes about half an hour. Fare: 290 yen. Shop at your leisure.'],links:[['เปิด Google Maps','https://maps.app.goo.gl/Tq7mrGyueZYJ95oC8']],images:['image9.png']},
        {title:'20:00 - Return to accommodation',text:['From Umeda Station on the Midosuji Line, get off at Shinsaibashi Station,',{value:'Exit 10.',kind:'highlight'},'Walk back to the hotel.'],links:[['เปิด Google Maps','https://maps.app.goo.gl/es4fJtyACeRYBNh68']],images:['image3.png']}
      ]},
      {id:8,kicker:'Day 8',date:'16 ตุลาคม 2026',title:'Osaka · Namba · Shinsaibashi',entries:[
        {title:'Friday, October 16, 2026 : Osaka'},
        {title:'Note',text:['Today, it is recommended to start the day by taking a taxi to the Lion Shrine because the walking path is quite confusing. The rest of the day can be spent walking, so Google Maps links are provided for you to follow.']},
        {title:'10:00 - Namba Yasaka Shrine (Lion Shrine)',text:['Tell the taxi driver "Namba Yasaka Jinja" or call a taxi using the Go Taxi app.'],links:[['เปิด Google Maps','https://maps.app.goo.gl/8GitGrjbi3ov2pTW9']]},
        {title:'12:00 - Visit Namba and have a meal',text:['Start at Namba Marui and go shopping.'],links:[['เปิด Google Maps','https://maps.app.goo.gl/t6Xcx2fwNBMwmPp97']]},
        {title:'15:00 - Shinsaibashi Shopping',text:['Walking further from Namba will bring you to Shinsaibashi.'],links:[['เปิด Google Maps','https://maps.app.goo.gl/Uz7SJkt9oeiLTXKb8']]},
        {title:'18:00 - Dinner and return to accommodation',text:['You can walk back to your accommodation directly from Shinsaibashi.'],links:[['เปิด Google Maps','https://maps.app.goo.gl/9vGSSME4Eca3n3XC7']]}
      ]},
      {id:9,kicker:'Day 9',date:'17 ตุลาคม 2026',title:'Osaka → Bangkok',entries:[
        {title:'Saturday, October 17, 2026 : Osaka -> Bangkok'},
        {title:'Travel to the airport',text:['To travel to the airport, walk from the hotel (Smile Hotel Premium Osaka Higashi-Shinsaibashi) to Namba Station.','Take the Nankai Line straight to the airport.','Upon arriving at Namba Station, find the Nankai train ticket counter and buy a ticket to the airport. The Nankai ticket price is 970 yen.'],links:[['เปิด Google Maps','https://maps.app.goo.gl/54QTdS5m1vWnjuGAA']],images:['image6.png']}
      ]}
    ];
    const quick=document.querySelector('.quick');quick.innerHTML=days.map(day=>`<a href="#day-${day.id}">${day.kicker}</a>`).join('');
    const search=document.querySelector('#travel-search');
    const goTop=document.querySelector('#go-top');
    function filterTravel(){const query=search.value.trim().toLowerCase();document.querySelectorAll('.day').forEach(day=>{let matched=false;day.querySelectorAll('.stop').forEach(stop=>{const hit=!query||stop.textContent.toLowerCase().includes(query);stop.hidden=!hit;if(hit)matched=true});day.hidden=Boolean(query&&!matched)})}
    search.addEventListener('input',filterTravel);
    function toggleGoTop(){goTop.classList.toggle('visible',window.scrollY>320)}
    window.addEventListener('scroll',toggleGoTop,{passive:true});toggleGoTop();goTop.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
    const main=document.querySelector('#days');
    days.forEach(day=>{
      const section=document.createElement('section');section.className='day';section.id='day-'+day.id;
      const entries=day.entries.map(entry=>{const images=(entry.images||[]).map((file,index)=>`<button class="doc-card" type="button" data-image="../assets/travel-document/${file}" data-alt="${entry.title} เอกสารรูปที่ ${index+1}"><img src="../assets/travel-document/${file}" alt="${entry.title} เอกสารรูปที่ ${index+1}" loading="lazy"><span class="doc-label">แตะเพื่อเปิดภาพ</span></button>`).join('');const paragraphs=(entry.text||[]).map(item=>{const value=typeof item==='string'?item:item.value;const kind=typeof item==='string'?'':` class="${item.kind||''}"`;return `<p${kind}>${value}</p>`}).join('');return `<article class="stop ${entry.variant||''}"><h3 class="stop-title">${entry.title}</h3>${paragraphs}${(entry.links||[]).map(([label,url])=>`<a href="${url}" target="_blank" rel="noopener">${label} ↗</a>`).join('')}${images?`<div class="stop-gallery">${images}</div>`:''}</article>`}).join('');
      section.innerHTML=`<div class="day-head"><p class="kicker">${day.kicker}</p><h2>${day.date}</h2><p class="day-brief">${day.title}</p></div><div class="schedule">${entries}</div>`;main.appendChild(section);
    });
    const viewer=document.querySelector('#viewer'),viewerImage=document.querySelector('#viewer-image');document.querySelectorAll('.doc-card').forEach(card=>card.addEventListener('click',()=>{viewerImage.src=card.dataset.image;viewerImage.alt=card.dataset.alt;viewer.hidden=false;document.body.style.overflow='hidden'}));
    function closeViewer(){viewer.hidden=true;document.body.style.overflow=''}document.querySelector('#close').addEventListener('click',closeViewer);viewer.addEventListener('click',event=>{if(event.target===viewer)closeViewer()});document.addEventListener('keydown',event=>{if(event.key==='Escape')closeViewer()});
  </script>
</body>
</html>
